name: Sugerir testes com IA

on:
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  sugerir:
    name: Sugestões de testes (GitHub Models)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/ai-sugerir-testes.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: testes-sugeridos
          path: reports/testes-sugeridos.json
