name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Testes de reservas
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Executar testes
        run: npm test
