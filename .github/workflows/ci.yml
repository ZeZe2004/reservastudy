name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Análise estática (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Limiar: 0 erros e 0 avisos.
      - name: ESLint
        run: |
          mkdir -p reports
          npm run lint -- --output-file reports/eslint.txt || (cat reports/eslint.txt && exit 1)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-eslint
          path: reports/
          if-no-files-found: ignore

  test:
    name: Testes e cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Limiar: todos os testes a passar; cobertura >= 80% linhas e funções, >= 70% ramos.
      - name: Testes de reservas
        run: |
          mkdir -p reports
          npm run test:ci | tee reports/testes.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-testes
          path: reports/

  ai-gate:
    name: Gate de IA (revisão de código)
    runs-on: ubuntu-latest
    needs: [lint, test]
    permissions:
      contents: read
      models: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Limiar e reprodutibilidade definidos em ai-gate/config.json.
      - name: Revisão por IA (2 execuções idênticas)
        run: node scripts/ai-gate.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-ai-gate
          path: reports/ai-gate.json
          if-no-files-found: ignore

  build:
    name: Build do site
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  sast:
    name: SAST (Semgrep + npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Limiar: nenhuma dependência com vulnerabilidade high ou critical.
      - name: Auditoria de dependências
        run: npm audit --audit-level=high
      - name: Semgrep
        run: |
          pipx install semgrep
          mkdir -p reports
          semgrep scan --config p/javascript --config p/owasp-top-ten --metrics off \
            --exclude node_modules --exclude dist --json --output reports/semgrep.json
      # Limiar: 0 resultados de severidade ERROR.
      - name: Verificar limiar do Semgrep
        run: node scripts/check-semgrep.js reports/semgrep.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-sast
          path: reports/

  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Servir o site
        run: |
          python3 -m http.server 8080 --directory dist &
          for i in $(seq 1 20); do curl -fsS http://localhost:8080/ > /dev/null && break; sleep 1; done
      - name: ZAP baseline
        run: |
          mkdir -p reports/zap && cp .zap/rules.tsv reports/zap/ && chmod -R 777 reports/zap
          docker run --rm --network host -v "$PWD/reports/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -t http://localhost:8080 -c rules.tsv -J zap.json -r zap.html -I
      # Limiar: 0 alertas de risco alto e 0 regras marcadas como FAIL em .zap/rules.tsv.
      - name: Verificar limiar do ZAP
        run: node scripts/check-zap.js reports/zap/zap.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: relatorio-dast
          path: reports/zap/

  deploy:
    name: Deploy (GitHub Pages)
    runs-on: ubuntu-latest
    needs: [build, sast, dast, ai-gate]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Confirmar versão publicada
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "${{ steps.deployment.outputs.page_url }}version.json" | grep -q "${{ github.sha }}"; then
              echo "Versão ${{ github.sha }} publicada."; exit 0
            fi
            sleep 10
          done
          echo "O site publicado não corresponde ao commit ${{ github.sha }}"; exit 1
